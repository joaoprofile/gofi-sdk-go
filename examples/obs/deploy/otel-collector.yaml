receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Exposes the metrics in Prometheus format; service.name becomes the job label.
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true # carries exemplars (trace IDs) to Prometheus
  # Loki 3 ingests OTLP natively; resource attributes become labels
  # (service_name) and trace_id/span_id become structured metadata.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
