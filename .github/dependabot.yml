version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/base"
      - "/base/bucket/oci"
      - "/base/bucket/s3"
      - "/base/cloud/aws"
      - "/base/cloud/oci"
      - "/base/secrets/awssm"
      - "/base/secrets/ocivault"
      - "/examples/iam/login"
      - "/examples/msq/kafka/consumer"
      - "/examples/msq/kafka/producer"
      - "/examples/msq/rabbitmq/consumer"
      - "/examples/msq/rabbitmq/producer"
      - "/examples/msq/sqs/consumer"
      - "/examples/msq/sqs/producer"
      - "/examples/netx/api"
      - "/examples/obs"
      - "/examples/sqln/filter-api"
      - "/examples/sqln/search"
      - "/gofi"
      - "/iam"
      - "/msq"
      - "/msq/provider/kafka"
      - "/msq/provider/nats"
      - "/msq/provider/oci"
      - "/msq/provider/rabbitmq"
      - "/msq/provider/redis"
      - "/msq/provider/sqs"
      - "/netx"
      - "/netx/awssign"
      - "/obs"
      - "/sqln"
      - "/sqln/rdsauth"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # version-update PRs off; security updates still open PRs
    groups:
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
      golang-x:
        patterns: ["golang.org/x/*"]
      aws-sdk:
        patterns: ["github.com/aws/*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
